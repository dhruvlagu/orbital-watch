<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kessler Microbenchmark</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #0a0e1a;
      color: #fff;
    }
    canvas {
      width: 600px;
      height: 400px;
      border: 1px solid #333;
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      margin-right: 10px;
      cursor: pointer;
    }
    .results {
      margin-top: 20px;
      padding: 10px;
      background: #111;
      border: 1px solid #333;
      max-height: 400px;
      overflow-y: auto;
    }
    .status {
      margin: 20px 0;
      padding: 10px;
      background: #1a1a2e;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Kessler Collision Loop Microbenchmark</h1>
  <div id="config"></div>
  <div style="margin: 20px 0;">
    <button id="runBtn">Run Microbenchmark</button>
  </div>
  <div id="status" class="status"></div>
  <div id="results" class="results"></div>
  <canvas id="canvas"></canvas>

  <script type="module">
    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const config = {
      objectCount: parseInt(params.get("objectCount") || "150"),
      maxDebrisToCheck: params.get("maxDebrisToCheck") === "all" ? "all" : parseInt(params.get("maxDebrisToCheck") || "50"),
      throttleRate: parseFloat(params.get("throttleRate") || "1"),
      measure: params.get("measure") || "both", // 'collision', 'render', or 'both'
    };

    document.getElementById('config').innerHTML = `
      <p><strong>Config:</strong></p>
      <p>objectCount: ${config.objectCount}</p>
      <p>maxDebrisToCheck: ${config.maxDebrisToCheck}</p>
      <p>throttleRate: ${config.throttleRate}x</p>
      <p>measure: ${config.measure}</p>
    `;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let debris = [];

    // Simulation parameters
    const altitudeMin = 400;
    const altitudeMax = 800;
    const inclinationMinDeg = -23;
    const inclinationMaxDeg = 23;

    const kmToRadius = (km) => km / 2000;
    const radiusMin = kmToRadius(altitudeMin);
    const radiusMax = kmToRadius(altitudeMax);
    const degToRad = (deg) => deg * (Math.PI / 180);
    const inclinationMin = degToRad(inclinationMinDeg);
    const inclinationMax = degToRad(inclinationMaxDeg);

    function generateDebris(count, rMin, rMax, iMin, iMax) {
      return Array.from({ length: count }, (_, i) => {
        const angle = (i / count) * Math.PI * 2;
        const radius = rMin + Math.random() * (rMax - rMin);
        const inclination = iMin + Math.random() * (iMax - iMin);

        const cosAngle = Math.cos(angle);
        const sinAngle = Math.sin(angle);
        const cosInc = Math.cos(inclination);
        const sinInc = Math.sin(inclination);

        const x3d = radius * cosAngle;
        const y3d = radius * sinAngle * cosInc;
        const z3d = radius * sinAngle * sinInc;

        const keplerConstant = 0.0025;
        const angularSpeed = keplerConstant / Math.pow(radius, 1.5);
        const orbitalSpeed = angularSpeed * radius;
        const vx = -orbitalSpeed * sinAngle;
        const vy = orbitalSpeed * cosAngle * cosInc;
        const vz = orbitalSpeed * cosAngle * sinInc;

        return {
          id: `d-${i}`,
          angle,
          radius,
          inclination,
          x: 0.5 + x3d,
          y: 0.5 + y3d,
          z: z3d,
          vx,
          vy,
          vz,
          size: 3,
        };
      });
    }

    function drawCanvas(debrisToDraw) {
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);

      const width = canvas.offsetWidth;
      const height = canvas.offsetHeight;

      ctx.fillStyle = "rgba(10, 14, 26, 0.95)";
      ctx.fillRect(0, 0, width, height);

      const centerX = width * 0.5;
      const centerY = height * 0.5;
      const earthRadius = 60;

      ctx.beginPath();
      ctx.arc(centerX, centerY, earthRadius * 0.67, 0, Math.PI * 2);
      ctx.fillStyle = "#0c152b";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(0, 212, 255, 0.5)";
      ctx.stroke();

      const focalLength = 2;
      const sortedDebris = [...debrisToDraw].sort((a, b) => a.z - b.z);

      sortedDebris.forEach((d) => {
        const scale = focalLength / (focalLength + d.z);
        const projectedX = centerX + (d.x - 0.5) * width * scale;
        const projectedY = centerY + (d.y - 0.5) * height * scale;
        const scaledSize = d.size * scale;
        const depthOpacity = Math.max(0.3, Math.min(1, scale));

        ctx.fillStyle = `rgba(0, 212, 255, ${depthOpacity})`;
        ctx.beginPath();
        ctx.arc(projectedX, projectedY, scaledSize, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Initialize debris
    debris = generateDebris(config.objectCount, radiusMin, radiusMax, inclinationMin, inclinationMax);
    drawCanvas(debris);

    // Button handler
    document.getElementById('runBtn').addEventListener('click', async () => {
      document.getElementById('status').textContent = 'Running microbenchmark...';

      // Apply CPU throttling via CDP
      if (window.chrome && chrome.debugger) {
        const debuggerPort = 9222;
        try {
          await fetch(`http://localhost:${debuggerPort}/json/version`);
        } catch (e) {
          // Need to start Chrome with remote debugging
        }
      }

      const WARMUP_FRAMES = 20;
      const TEST_FRAMES = 200;
      const collisionThreshold = 0.04;

      const collisionTimes = [];
      const renderTimes = [];
      const pairsCheckedPerFrame = [];

      // Warmup
      for (let i = 0; i < WARMUP_FRAMES; i++) {
        // Update positions
        const keplerConstant = 0.0025;
        debris = debris.map((d) => {
          const angularSpeed = keplerConstant / Math.pow(d.radius, 1.5);
          const nextAngle = (d.angle + angularSpeed) % (Math.PI * 2);
          const cosAngle = Math.cos(nextAngle);
          const sinAngle = Math.sin(nextAngle);
          const cosInc = Math.cos(d.inclination);
          const sinInc = Math.sin(d.inclination);

          const x3d = d.radius * cosAngle;
          const y3d = d.radius * sinAngle * cosInc;
          const z3d = d.radius * sinAngle * sinInc;

          return {
            ...d,
            angle: nextAngle,
            x: 0.5 + x3d,
            y: 0.5 + y3d,
            z: z3d,
          };
        });

        // Collision check
        let maxDebrisToCheck;
        if (config.maxDebrisToCheck === "all") {
          maxDebrisToCheck = debris.length;
        } else {
          maxDebrisToCheck = Math.min(debris.length, config.maxDebrisToCheck);
        }

        for (let i = 0; i < maxDebrisToCheck; i++) {
          for (let j = i + 1; j < maxDebrisToCheck; j++) {
            const d1 = debris[i];
            const d2 = debris[j];
            const dx = d1.x - d2.x;
            const dy = d1.y - d2.y;
            const dz = d1.z - d2.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
          }
        }

        // Render
        drawCanvas(debris);
      }

      // Actual measurement
      for (let i = 0; i < TEST_FRAMES; i++) {
        // Update positions
        const keplerConstant = 0.0025;
        debris = debris.map((d) => {
          const angularSpeed = keplerConstant / Math.pow(d.radius, 1.5);
          const nextAngle = (d.angle + angularSpeed) % (Math.PI * 2);
          const cosAngle = Math.cos(nextAngle);
          const sinAngle = Math.sin(nextAngle);
          const cosInc = Math.cos(d.inclination);
          const sinInc = Math.sin(d.inclination);

          const x3d = d.radius * cosAngle;
          const y3d = d.radius * sinAngle * cosInc;
          const z3d = d.radius * sinAngle * sinInc;

          return {
            ...d,
            angle: nextAngle,
            x: 0.5 + x3d,
            y: 0.5 + y3d,
            z: z3d,
          };
        });

        // Measure collision check
        if (config.measure === 'collision' || config.measure === 'both') {
          const collisionStart = performance.now();
          let maxDebrisToCheck;
          if (config.maxDebrisToCheck === "all") {
            maxDebrisToCheck = debris.length;
          } else {
            maxDebrisToCheck = Math.min(debris.length, config.maxDebrisToCheck);
          }

          let pairsChecked = 0;
          for (let i = 0; i < maxDebrisToCheck; i++) {
            for (let j = i + 1; j < maxDebrisToCheck; j++) {
              const d1 = debris[i];
              const d2 = debris[j];
              const dx = d1.x - d2.x;
              const dy = d1.y - d2.y;
              const dz = d1.z - d2.z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
              pairsChecked++;
            }
          }
          const collisionEnd = performance.now();
          collisionTimes.push(collisionEnd - collisionStart);
          pairsCheckedPerFrame.push(pairsChecked);
        }

        // Measure rendering
        if (config.measure === 'render' || config.measure === 'both') {
          const renderStart = performance.now();
          drawCanvas(debris);
          const renderEnd = performance.now();
          renderTimes.push(renderEnd - renderStart);
        }
      }

      // Calculate statistics
      const calcStats = (arr) => {
        const sorted = [...arr].sort((a, b) => a - b);
        const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
        const p95 = sorted[Math.floor(sorted.length * 0.95)];
        const max = sorted[sorted.length - 1];
        return { mean, p95, max };
      };

      const collisionStats = calcStats(collisionTimes);
      const renderStats = calcStats(renderTimes);
      const pairsStats = calcStats(pairsCheckedPerFrame);

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
        <h3>Microbenchmark Results (${TEST_FRAMES} frames)</h3>
        ${config.measure === 'collision' || config.measure === 'both' ? `
          <h4>Collision Loop</h4>
          <p>COLLISION_MEAN: ${collisionStats.mean.toFixed(4)}</p>
          <p>COLLISION_P95: ${collisionStats.p95.toFixed(4)}</p>
          <p>COLLISION_MAX: ${collisionStats.max.toFixed(4)}</p>
          <p>COLLISION_PAIRS: ${pairsStats.mean.toFixed(0)}</p>
        ` : ''}
        ${config.measure === 'render' || config.measure === 'both' ? `
          <h4>Canvas Rendering</h4>
          <p>RENDER_MEAN: ${renderStats.mean.toFixed(4)}</p>
          <p>RENDER_P95: ${renderStats.p95.toFixed(4)}</p>
          <p>RENDER_MAX: ${renderStats.max.toFixed(4)}</p>
        ` : ''}
      `;

      document.getElementById('status').textContent = 'Complete';
    });
  </script>
</body>
</html>
